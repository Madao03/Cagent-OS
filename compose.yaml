services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEFAULT_MODEL_ALIAS=${DEFAULT_MODEL_ALIAS:-deepseek-flash}
      - SQLITE_DATA_DIR=/app/data
      - CONVERSATION_DB_PATH=/app/data/conversations.db
      - MEMORY_DB_PATH=/app/data/memory.db
      - TRACE_DB_PATH=/app/data/trace.db
      - MCP_SERVERS_CONFIG=/app/config/mcp_servers.json
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEBUG=${DEBUG:-false}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./knowledge:/app/knowledge
    restart: unless-stopped

