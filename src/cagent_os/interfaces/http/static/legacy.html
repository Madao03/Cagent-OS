<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CagentOS Terminal</title>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --border: #1a2a1a;
    --green: #00ff88;
    --green-dim: #0a3a1a;
    --text: #c0c0c0;
    --text-dim: #666;
    --red: #ff4466;
    --yellow: #ffaa00;
    --blue: #4488ff;
    --font: 'Consolas', 'Courier New', 'LXGW WenKai Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 28px;                       /* ← ×2 from 14px */
    height: 100vh; display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 2px solid var(--border);
    padding: 14px 28px;
    display: flex; align-items: center; gap: 16px;
    font-size: 22px; color: var(--text-dim);
    flex-shrink: 0;
  }
  header .logo { color: var(--green); font-weight: bold; font-size: 26px; letter-spacing: 3px; }
  header .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  header .dot.green { background: var(--green); box-shadow: 0 0 10px var(--green); }
  header .dot.yellow { background: var(--yellow); }
  header .dot.red { background: var(--red); }
  header .status { margin-left: auto; font-size: 20px; }
  header .status .val { color: var(--green); }

  /* ── Chat area ── */
  main {
    flex: 1; overflow-y: auto; padding: 20px 28px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .msg { max-width: 88%; padding: 14px 20px; border-radius: 6px; line-height: 1.7; font-size: 26px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--green-dim); border: 2px solid var(--border); color: var(--text); }
  .msg.assistant { align-self: flex-start; background: var(--surface); border: 2px solid var(--border); }
  .msg.system { align-self: center; font-size: 22px; color: var(--text-dim); background: transparent; border: none; }
  .msg.error { align-self: center; color: var(--red); font-size: 22px; background: rgba(255,68,102,0.1); border: 2px solid var(--red); }
  .msg.step { align-self: flex-start; background: rgba(68,136,255,0.08); border: 1px solid rgba(68,136,255,0.3); border-radius: 4px; padding: 8px 14px; font-size: 20px; color: var(--blue); }
  .msg .step-num { color: var(--text-dim); margin-right: 8px; }
  .msg .time { font-size: 20px; color: var(--text-dim); margin-bottom: 6px; }
  .msg .prefix { color: var(--green); }
  .msg .ticker { color: var(--yellow); font-weight: bold; }
  .msg .number { color: var(--green); }

  /* ── Table rendering ── */
  .md-table { border-collapse: collapse; margin: 8px 0; font-size: 22px; width: 100%; }
  .md-table th { background: var(--green-dim); color: var(--green); border: 1px solid var(--border); padding: 6px 12px; text-align: left; font-weight: bold; }
  .md-table td { border: 1px solid var(--border); padding: 6px 12px; color: var(--text); }
  .md-table tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

  /* ── Input ── */
  footer {
    background: var(--surface);
    border-top: 2px solid var(--border);
    padding: 16px 28px;
    display: flex; gap: 12px; align-items: center;
    flex-shrink: 0;
  }
  footer .prompt { color: var(--green); font-size: 28px; white-space: nowrap; }
  footer input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-family: var(--font); font-size: 26px;
    caret-color: var(--green);
  }
  footer input::placeholder { color: var(--text-dim); }
  footer button {
    background: var(--green-dim); color: var(--green);
    border: 2px solid var(--border); padding: 10px 24px;
    font-family: var(--font); font-size: 22px; cursor: pointer;
    border-radius: 4px; transition: background 0.2s; min-width: 100px;
  }
  footer button:hover { background: rgba(0,255,136,0.15); }
  footer button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Scrollbar ── */
  main::-webkit-scrollbar { width: 6px; }
  main::-webkit-scrollbar-track { background: var(--bg); }
  main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Loading dots ── */
  .loading::after { content: ''; animation: dots 1.5s steps(4) infinite; }
  @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} 100%{content:''} }
  .blink { animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

<header>
  <span class="dot green"></span><span class="dot yellow"></span><span class="dot red"></span>
  <span class="logo">CagentOS</span>
  <span>v0.2</span>
  <span class="status">CHUNKS: <span class="val" id="rag-status">---</span> | MODEL: <span class="val">DS V4 Pro</span></span>
</header>

<main id="chat"></main>

<footer>
  <span class="prompt blink">❯</span>
  <input id="input" type="text" placeholder="输入你的问题..." autofocus>
  <button id="send-btn" onclick="send()">发送</button>
</footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const btn = document.getElementById('send-btn');
const ragStatus = document.getElementById('rag-status');

let loading = false;
let activeStream = null;

// ── Render markdown-ish text with table support ──
function renderText(text) {
  // Detect pipe tables: consecutive lines starting with |
  const lines = text.split('\n');
  let result = '';
  let inTable = false;
  let tableRows = [];

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    const isPipeLine = line.startsWith('|') && line.endsWith('|');

    if (isPipeLine) {
      if (!inTable) { inTable = true; tableRows = []; }
      tableRows.push(line);
      if (i < lines.length - 1 && lines[i+1].trim().startsWith('|')) continue;
    }
    if (!isPipeLine || i === lines.length - 1) {
      if (inTable && tableRows.length >= 2) {
        result += _buildTable(tableRows) + '\n';
        tableRows = [];
      }
      inTable = false;
      if (!isPipeLine) result += line + '\n';
    }
  }

  return result
    .replace(/\*\*(.+?)\*\*/g, '<b style="color:var(--green)">$1</b>')
    .replace(/\b([A-Z]{2,5})\b/g, '<span class="ticker">$1</span>')
    .replace(/\$?([\d,]+\.?\d*[MBK%]?)\b/g, '<span class="number">$1</span>');
}

function _buildTable(rows) {
  if (rows.length < 2) return rows.join('\n');
  // Skip separator row (|---|...|)
  const headerRow = rows[0];
  const dataRows = rows.filter((r, i) => i === 0 || !/^\|[\s\-:|]+\|$/.test(r));
  let html = '<table class="md-table">';
  dataRows.forEach((row, ri) => {
    const cells = row.split('|').filter(c => c.trim()).map(c => c.trim());
    const tag = ri === 0 ? 'th' : 'td';
    html += '<tr>' + cells.map(c => `<${tag}>${c}</${tag}>`).join('') + '</tr>';
  });
  html += '</table>';
  return html;
}

// ── Add message ──
function addMsg(role, text, prefix = '') {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (prefix) {
    const sp = document.createElement('span');
    sp.className = 'prefix';
    sp.textContent = prefix + ' ';
    div.appendChild(sp);
  }
  const content = document.createElement('span');
  content.innerHTML = renderText(text);
  div.appendChild(content);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// ── Add step indicator (ReAct loop visualization) ──
function addStep(toolName, args, status, elapsed) {
  const div = document.createElement('div');
  div.className = 'msg step';
  const argsStr = typeof args === 'string' ? args.substring(0, 80) : JSON.stringify(args || {}).substring(0, 80);
  const statusIcon = status === 'ok' ? '✅' : status === 'error' ? '❌' : '⏳';
  const timeStr = elapsed ? ` (${elapsed}ms)` : '';
  div.innerHTML = `<span class="step-num">${statusIcon}</span> <b>${toolName}</b>${timeStr}<br><span style="font-size:18px;color:var(--text-dim)">${argsStr}</span>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

// ── Send message ──
async function send() {
  const msg = input.value.trim();
  if (!msg || loading) return;

  addMsg('user', msg);
  input.value = '';
  loading = true;
  btn.disabled = true;

  // Use streaming endpoint for ReAct visualization
  const useStream = true;

  if (useStream) {
    try {
      const resp = await fetch('/api/v1/conversations/default/messages', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({user_id: 'default', content: msg, stream: true})
      });

      if (!resp.ok) {
        const errText = await resp.text();
        addMsg('error', `[HTTP ${resp.status}] ${errText}`);
        loading = false; btn.disabled = false; input.focus();
        return;
      }

      const assistantDiv = document.createElement('div');
      assistantDiv.className = 'msg assistant';
      assistantDiv.textContent = '';
      chat.appendChild(assistantDiv);

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let stepCount = 0;

      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, {stream: true});
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const data = JSON.parse(line.substring(6));
            // Tool call event
            if (data.type === 'run.tool_started' && data.capability_id) {
              addStep(data.capability_id, data.arguments || '', 'pending', 0);
            }
            if (data.type === 'run.tool_completed' && data.capability_id) {
              addStep(data.capability_id, data.arguments || '', data.status || 'ok', data.elapsed_ms);
            }
            // Text delta
            if (data.type === 'message.assistant_delta' && data.content) {
              assistantDiv.innerHTML += data.content;
              chat.scrollTop = chat.scrollHeight;
            }
            if (data.type === 'message.assistant_added' && data.content) {
              assistantDiv.innerHTML = renderText(data.content);
            }
            // Errors
            if (data.type === 'run.tool_failed') {
              addStep(data.capability_id || 'unknown', data.error || '', 'error', data.elapsed_ms);
            }
          } catch(e) {}
        }
      }
      if (!assistantDiv.innerHTML.trim()) {
        assistantDiv.innerHTML = '(空回复)';
      }
    } catch(e) {
      addMsg('error', '[ERROR] ' + e.message);
    }
    loading = false;
    btn.disabled = false;
    input.focus();
    return;
  }

  // ── Fallback: oneshot mode ──
  try {
    const resp = await fetch('/api/v1/runs/oneshot', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user_id: 'default', content: msg})
    });
    const data = await resp.json();
    if (data.error) {
      addMsg('error', '[ERROR] ' + data.error);
    } else {
      addMsg('assistant', data.assistant_content || data.content || JSON.stringify(data));
    }
  } catch(e) {
    addMsg('error', '[ERROR] ' + e.message);
  }
  loading = false;
  btn.disabled = false;
  input.focus();
}

// ── Enter to send ──
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

// ── Health check ──
fetch('/health')
  .then(r => r.json())
  .then(d => { ragStatus.textContent = d.status === 'healthy' ? 'ONLINE' : d.status; ragStatus.style.color = 'var(--green)'; })
  .catch(() => { ragStatus.textContent = 'OFFLINE'; ragStatus.style.color = 'var(--red)'; });

// ── Welcome ──
addMsg('system', '╔════════════════════════════════╗');
addMsg('system', '║  CagentOS v0.2 — Phase 4 Demo  ║');
addMsg('system', '╚════════════════════════════════╝');

// ── Keyboard shortcuts ──
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'k') { e.preventDefault(); input.focus(); input.value = ''; }
});
</script>
</body>
</html>
