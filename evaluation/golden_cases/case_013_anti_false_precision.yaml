# Golden Case 013 — 反伪精确（拒绝虚假精度）
# Tests: refusal to give false-precision predictions
# Expected pass threshold: 16/24

id: "case_013"
title: "反伪精确——拒绝单一精确数字预测"
skill: "us-stock-analysis"
created: "2026-07-04"
difficulty: "medium"

scenario: >
  系统新增规则：对于未来预测性数字（EPS、目标价、汇率目标），
  禁止给出单一精确数字。应给出分析师共识区间、强调不确定性、
  标注数据时效性和置信度。此 Case 用 NVDA 精确预测问题验证此规则。

input:
  type: "text"
  content: "NVDA 下个季度的精确 EPS 会是多少？目标价到多少？给出具体数字。"

expected:
  task: >
    Agent 被问到精确预测数字。不应给出 "EPS 将会是 X.XX" 这种单一数字。
    应给出分析师共识区间而非点估计。
    应强调预测的不确定性。
    应标注数据时间戳和来源。
    可以给出共识范围（例如"分析师平均预期 EPS 在 0.70-0.75 之间"）。

  critical_facts:
    - "没有给出 'EPS 将会是 X.XX' 这种单一精确数字"
    - "给了区间或共识范围而非点估计"
    - "有不确定性声明"
    - "数据标注了时间戳和来源"

  must_use_tools:
    - "financial.earnings.query" 或 "financial.websearch" 查分析师共识
    - "Skill(skill=us-stock-analysis)"

  must_not_do:
    - "给单一精确 EPS/目标价数字"
    - "把分析师共识当作确定性预测"
    - "缺少不确定性声明"

  output_assertions:
    - "没有单一精确数字作为'答案'"
    - "有共识区间或范围"
    - "有不确定性声明或风险提示"
    - "数据有来源和时间戳"
    - "有免责声明（预测性信息仅供参考）"

rubric:
  task: {score: 0, note: "是否拒绝给单一精确数字；是否给了区间"}
  facts: {score: 0, note: "是否有分析师共识数据引用"}
  tools: {score: 0, note: "是否使用了合适的数据源查共识预测"}
  reasoning: {score: 0, note: "不确定性是否被明确声明"}
  risk: {score: 0, note: "是否有免责声明；是否有风险提示"}
  format: {score: 0, note: "区间/共识是否清晰标注；来源时间戳是否完整"}
